spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/backend
spring.datasource.username=nguyenanhnhut
# Schema giờ do Flyway quản lý (src/main/resources/db/migration) - Hibernate chỉ validate entity
# khớp schema, KHÔNG tự sửa DDL nữa. baseline-on-migrate=true vì DB local đã có schema từ trước
# (tạo bằng ddl-auto=update) chưa qua Flyway lần nào.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true

# ${VAR:default}: đọc từ biến môi trường, KHÔNG set thì dùng default (chỉ dùng được cho dev local).
# application-prod.properties override lại KHÔNG có default -> thiếu biến môi trường là app không
# boot được ở prod, thay vì âm thầm chạy với secret/credential sai.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-before-any-real-deployment-32chars}
jwt.expiration-ms=3600000

order.payment-expiry-minutes=15

# VNPay sandbox — replace with your own test merchant credentials from
# https://sandbox.vnpayment.vn (Merchant Admin > Account) before testing real payments.
vnpay.merchant-code=${VNPAY_MERCHANT_CODE:CHANGE_ME}
vnpay.hash-secret=${VNPAY_HASH_SECRET:CHANGE_ME}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/webhooks/vnpay

# Stripe test keys — replace with your own from https://dashboard.stripe.com/test/apikeys
# (webhook secret comes from `stripe listen --forward-to localhost:8080/api/payments/webhooks/stripe`
# when testing locally, or from the Dashboard > Developers > Webhooks once deployed).
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_CHANGE_ME}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_CHANGE_ME}

# Origin FE được phép gọi API (comma-separated). Bearer-token auth (không cookie) nên
# allowCredentials luôn false - xem SecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Chỉ expose /actuator/health - không bật /actuator/env,/beans,... (lộ thông tin nội bộ).
management.endpoints.web.exposure.include=health

auth.login.max-attempts=5
auth.login.window-minutes=15
