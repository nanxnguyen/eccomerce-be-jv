spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/backend
spring.datasource.username=nguyenanhnhut
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Schema giờ do Flyway quản lý (src/main/resources/db/migration) - Hibernate chỉ validate entity
# khớp schema, KHÔNG tự sửa DDL nữa. baseline-on-migrate=true vì DB local đã có schema từ trước
# (tạo bằng ddl-auto=update) chưa qua Flyway lần nào.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true

# ${VAR:default}: đọc từ biến môi trường, KHÔNG set thì dùng default (chỉ dùng được cho dev local).
# application-prod.properties override lại KHÔNG có default -> thiếu biến môi trường là app không
# boot được ở prod, thay vì âm thầm chạy với secret/credential sai.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-before-any-real-deployment-32chars}
# 15 phút - access token ngắn hạn, đủ dùng nhờ có refresh token (30 ngày) rotate qua /api/auth/refresh.
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

order.payment-expiry-minutes=15

# VNPay sandbox — replace with your own test merchant credentials from
# https://sandbox.vnpayment.vn (Merchant Admin > Account) before testing real payments.
vnpay.merchant-code=${VNPAY_MERCHANT_CODE:CHANGE_ME}
vnpay.hash-secret=${VNPAY_HASH_SECRET:CHANGE_ME}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/webhooks/vnpay

# Stripe test keys — replace with your own from https://dashboard.stripe.com/test/apikeys
# (webhook secret comes from `stripe listen --forward-to localhost:8080/api/payments/webhooks/stripe`
# when testing locally, or from the Dashboard > Developers > Webhooks once deployed).
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_CHANGE_ME}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_CHANGE_ME}

# Origin FE được phép gọi API (comma-separated). Bearer-token auth (không cookie) nên
# allowCredentials luôn false - xem SecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Chỉ expose health và metrics cho Prometheus - không bật /env,/beans,... vì lộ thông tin nội bộ.
management.endpoints.web.exposure.include=health,prometheus
management.server.port=8081

auth.login.max-attempts=5
auth.login.window-minutes=15

# Dùng cho RedisLoginRateLimiter (auth:rate-limit:login:{ip}) - đếm nhất quán khi chạy nhiều
# instance app, khác với bản in-memory cũ (mỗi instance đếm riêng). Xem docs/architecture-roadmap.md §5.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Email delivery stays disabled until MAIL_HOST is set. Credentials are environment-only.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:nguyenanhnhut0101.99@gmail.com}
app.mail.max-attempts=${MAIL_MAX_ATTEMPTS:5}

# Request/response bodies are opt-in; Compose enables them only for local learning.
app.http-logging.include-body=${HTTP_LOG_BODIES:false}

# Keycloak is opt-in outside the local Compose stack; legacy JWT login remains available.
app.keycloak.enabled=${KEYCLOAK_ENABLED:false}
app.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
app.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
app.keycloak.audience=${KEYCLOAK_AUDIENCE:ecommerce-api}
