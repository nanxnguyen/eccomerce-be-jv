# Profile prod: kích hoạt bằng --spring.profiles.active=prod (hoặc SPRING_PROFILES_ACTIVE=prod).
# Mọi giá trị nhạy cảm ở đây KHÔNG có default (${VAR}, không phải ${VAR:default}) - thiếu biến môi
# trường tương ứng thì app fail-fast lúc boot, không bao giờ âm thầm chạy với secret/credential sai
# hay trỏ nhầm database.

# Set DATABASE_URL in Render using the JDBC form:
# jdbc:postgresql://<host>:<port>/<database>?user=<user>&password=<password>
spring.datasource.url=${DATABASE_URL}

# Temporary bootstrap for the first Render deployment. Switch back to validate
# after the database schema has been created and Flyway is confirmed working.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

vnpay.merchant-code=${VNPAY_MERCHANT_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Tin header X-Forwarded-* (scheme/host/port thật) từ reverse proxy đứng trước app (nginx/ALB/...).
# Giả định bắt buộc: proxy đó phải STRIP X-Forwarded-* do client tự gửi trước khi gắn giá trị thật
# của chính nó - nếu app nhận request thẳng từ internet (không qua proxy), KHÔNG bật dòng này vì
# client tự chế X-Forwarded-For sẽ giả mạo được IP nhìn thấy bởi rate-limiter (LoginRateLimiter).
server.forward-headers-strategy=framework
# Render supplies PORT; 10000 is its default for web services.
server.port=${PORT:10000}
server.address=0.0.0.0

# Tắt tài liệu API công khai ở prod - /v3/api-docs, /swagger-ui/** đang permitAll ở SecurityConfig,
# tắt hẳn springdoc là cách đơn giản nhất để endpoint đó biến mất hoàn toàn thay vì phải thêm rule
# security riêng.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Console log mặc định của Spring Boot đã đủ dùng khi platform host (ECS/Cloud Run/k8s) tự thu
# stdout - không thêm logback-spring.xml/JSON encoder ở đây vì chưa biết log sẽ đổ vào đâu
# (CloudWatch/ELK/Loki...), mỗi nơi cần format khác nhau. Chỉ hạ mức ồn: SQL/binder log của
# Hibernate không cần thiết khi show-sql đã tắt.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
