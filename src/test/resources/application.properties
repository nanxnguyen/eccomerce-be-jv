spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Flyway giờ ở classpath (dùng cho prod/dev Postgres) nhưng V1__init.sql viết bằng cú pháp Postgres
# (bigint GENERATED BY DEFAULT AS IDENTITY, character varying...) - H2 không hiểu, sẽ fail khi chạy
# test. Test tự tạo schema qua ddl-auto=create-drop ở trên, không cần Flyway.
spring.flyway.enabled=false
# Bật để test có thể đếm số query thật chạy ra (statistics.getQueryExecutionCount()) - dùng để
# chứng minh fix N+1 thật sự giảm số query, không chỉ "trông có vẻ đúng".
spring.jpa.properties.hibernate.generate_statistics=true

jwt.secret=test-secret-key-please-make-it-at-least-32-chars-long
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=2592000000

order.payment-expiry-minutes=15
vnpay.merchant-code=TEST_MERCHANT
vnpay.hash-secret=TEST_HASH_SECRET_AT_LEAST_THIS_LONG
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/webhooks/vnpay
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_dummy

app.cors.allowed-origins=http://localhost:3000
auth.login.max-attempts=5
auth.login.window-minutes=15
# Test dùng bản in-memory, không cần Redis thật để chạy `mvn test` - giống lý do dùng H2 thay Postgres.
auth.login.rate-limiter=in-memory
